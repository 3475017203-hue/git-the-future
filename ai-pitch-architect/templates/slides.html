<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 路演幻灯片预览 - {{ pitch.project_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #fff;
        }
        .slideshow {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f0f1a;
        }
        .slide-container {
            width: 90vw;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 50px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }
        .slide-number {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 0.85em;
            color: #667eea;
        }
        .slide-title {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .slide-subtitle {
            font-size: 1.2em;
            color: #a0a0c0;
            margin-bottom: 30px;
        }
        .slide-points {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .slide-point {
            font-size: 1.3em;
            margin: 12px 0;
            padding-left: 25px;
            position: relative;
            color: #e0e0f0;
        }
        .slide-point::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: #667eea;
        }
        .slide-visual {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.85em;
            color: #8888aa;
            font-style: italic;
        }
        
        /* Nav */
        .nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(30,30,50,0.9);
            padding: 12px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        .nav button {
            background: rgba(102,126,234,0.3);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .nav button:hover { background: #667eea; }
        .nav .counter { color: #a0a0c0; font-size: 0.9em; }
        
        /* Thumbnails */
        .thumbnails {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .thumb {
            width: 60px;
            padding: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.65em;
            color: #8888aa;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .thumb.active { border-color: #667eea; color: #667eea; }
        .thumb:hover { background: rgba(255,255,255,0.1); }
        
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← 返回首页</a>
    
    <div class="slideshow">
        <div class="slide-container" id="slideContainer">
            <div class="slide-number" id="slideNum"></div>
            <div class="slide-title" id="slideTitle"></div>
            <div class="slide-subtitle" id="slideSubtitle"></div>
            <div class="slide-points" id="slidePoints"></div>
            <div class="slide-visual" id="slideVisual"></div>
        </div>
    </div>
    
    <div class="nav">
        <button onclick="prev()">◀ 上一页</button>
        <span class="counter" id="counter"></span>
        <button onclick="next()">下一页 ▶</button>
    </div>
    
    <div class="thumbnails" id="thumbnails"></div>
    
    <script>
        const slides = {{ pitch.slides_json|safe }};
        let current = 0;
        
        function renderSlide(idx) {
            const s = slides[idx];
            document.getElementById('slideTitle').textContent = s.title;
            document.getElementById('slideSubtitle').textContent = s.subtitle || '';
            document.getElementById('slidePoints').innerHTML = (s.points || []).map(p => 
                `<div class="slide-point">${p}</div>`).join('');
            document.getElementById('slideVisual').textContent = s.visual_suggestion ? '🎨 ' + s.visual_suggestion : '';
            document.getElementById('counter').textContent = `${idx + 1} / ${slides.length}`;
            document.getElementById('slideNum').textContent = `${s.slide_number}/10`;
            
            // Update thumbnails
            document.querySelectorAll('.thumb').forEach((t, i) => {
                t.classList.toggle('active', i === idx);
            });
        }
        
        function next() {
            current = (current + 1) % slides.length;
            renderSlide(current);
        }
        
        function prev() {
            current = (current - 1 + slides.length) % slides.length;
            renderSlide(current);
        }
        
        // Build thumbnails
        const thumbs = document.getElementById('thumbnails');
        slides.forEach((s, i) => {
            const d = document.createElement('div');
            d.className = 'thumb';
            d.textContent = `${s.slide_number}`;
            d.title = s.title;
            d.onclick = () => { current = i; renderSlide(i); };
            thumbs.appendChild(d);
        });
        
        // Keyboard nav
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') next();
            else if (e.key === 'ArrowLeft') prev();
        });
        
        renderSlide(0);
    </script>
</body>
</html>
