<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI学习诊断{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar-brand { color: white; font-size: 20px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .navbar-nav { display: flex; gap: 8px; list-style: none; }
        .navbar-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; transition: all 0.2s; }
        .navbar-nav a:hover, .navbar-nav a.active { background: rgba(255,255,255,0.2); color: white; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
        .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: all 0.2s; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background: #f1f3f5; color: #495057; }
        .btn-secondary:hover { background: #e9ecef; }
        .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; }
        .btn-warning { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        input, select, textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #e9ecef; border-radius: 10px; font-size: 14px; transition: border-color 0.2s; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #667eea; }
        label { font-size: 13px; color: #666; margin-bottom: 6px; display: block; font-weight: 500; }
        .form-group { margin-bottom: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .stat-card { background: white; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .stat-number { font-size: 32px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { font-size: 13px; color: #888; margin-top: 4px; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .tag-purple { background: #f3f0ff; color: #7c3aed; }
        .tag-green { background: #ecfdf5; color: #059669; }
        .tag-red { background: #fef2f2; color: #dc2626; }
        .tag-yellow { background: #fefce8; color: #ca8a04; }
        .alert { padding: 14px 18px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; }
        .alert-info { background: #eff6ff; border-left: 4px solid #3b82f6; color: #1e40af; }
        .alert-success { background: #ecfdf5; border-left: 4px solid #10b981; color: #065f46; }
        .alert-warning { background: #fffbeb; border-left: 4px solid #f59e0b; color: #92400e; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px 12px; font-size: 12px; color: #888; border-bottom: 1px solid #f1f3f5; font-weight: 500; text-transform: uppercase; }
        td { padding: 12px; font-size: 14px; border-bottom: 1px solid #f8f9fa; }
        tr:hover { background: #fafafa; }
        .score-bar { height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
        @media (max-width: 768px) { .grid-3 { grid-template-columns: 1fr; } .grid-2 { grid-template-columns: 1fr; } }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">📚 AI学习诊断</a>
        <ul class="navbar-nav">
            <li><a href="/dashboard"><span>📊</span> 仪表盘</a></li>
            <li><a href="/record"><span>✍️</span> 记录</a></li>
            <li><a href="/quiz"><span>📝</span> 测验</a></li>
            <li><a href="/diagnosis"><span>🤖</span> AI诊断</a></li>
            <li><a href="/plan"><span>🗺️</span> 学习计划</a></li>
        </ul>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        // 通用工具函数
        function $(sel) { return document.querySelector(sel); }
        function $$(sel) { return document.querySelectorAll(sel); }

        async function api(url, options = {}) {
            try {
                const res = await fetch(url, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    body: options.body ? JSON.stringify(options.body) : undefined,
                    method: options.method || 'GET'
                });
                return await res.json();
            } catch (e) {
                return { success: false, message: '网络错误: ' + e.message };
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
