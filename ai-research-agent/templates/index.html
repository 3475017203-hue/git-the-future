<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI多智能体研究助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            text-align: center;
            padding: 30px 0;
        }
        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p { color: #888; font-size: 1.1em; }
        .agent-team {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .agent-badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .agent-badge:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .agent-badge.researcher { border-color: #00d4ff; color: #00d4ff; }
        .agent-badge.analyst { border-color: #f59e0b; color: #f59e0b; }
        .agent-badge.writer { border-color: #10b981; color: #10b981; }
        .agent-badge.reviewer { border-color: #ec4899; color: #ec4899; }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        .card h2 {
            font-size: 1.2em;
            margin-bottom: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 0.9em;
        }
        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1em;
            transition: border 0.3s;
        }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .input-group textarea { min-height: 120px; resize: vertical; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            width: 100%;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,212,255,0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .status-bar {
            margin-top: 16px;
            padding: 12px;
            background: rgba(0,212,255,0.1);
            border-radius: 8px;
            font-size: 0.9em;
            display: none;
        }
        .status-bar.active { display: block; }
        .progress-steps { margin-top: 16px; }
        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .step.active { opacity: 1; }
        .step.done { opacity: 1; }
        .step-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .step.active .step-icon {
            border-color: #00d4ff;
            color: #00d4ff;
            animation: pulse 1.5s infinite;
        }
        .step.done .step-icon {
            background: #10b981;
            border-color: #10b981;
            color: #fff;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(0,212,255,0); }
        }
        .step-text { font-size: 0.9em; }
        .report-output {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            display: none;
        }
        .report-output.active { display: block; }
        .report-content {
            line-height: 1.8;
            color: #d0d0d0;
            font-size: 0.95em;
        }
        .report-content h1 { font-size: 1.5em; color: #00d4ff; margin: 20px 0 10px; }
        .report-content h2 { font-size: 1.2em; color: #7c3aed; margin: 16px 0 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .report-content h3 { font-size: 1em; color: #f59e0b; margin: 12px 0 6px; }
        .report-content p { margin: 8px 0; }
        .report-content ul, .report-content ol { margin: 8px 0 8px 20px; }
        .report-content li { margin: 4px 0; }
        .report-content code { background: rgba(0,212,255,0.2); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .report-content pre { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
        .report-content blockquote {
            border-left: 3px solid #7c3aed;
            padding-left: 12px;
            margin: 12px 0;
            color: #aaa;
        }
        .review-card {
            margin-top: 20px;
            padding: 16px;
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 8px;
            display: none;
        }
        .review-card.active { display: block; }
        .review-scores {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .score-item {
            text-align: center;
        }
        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #10b981;
        }
        .score-label { font-size: 0.8em; color: #888; }
        .quick-section { margin-top: 20px; }
        .quick-result {
            margin-top: 16px;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            line-height: 1.8;
            display: none;
        }
        .quick-result.active { display: block; }
        .api-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8em;
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.4);
            color: #ef4444;
        }
        .api-status.configured {
            background: rgba(16,185,129,0.2);
            border-color: rgba(16,185,129,0.4);
            color: #10b981;
        }
        .history-section { margin-top: 30px; }
        .history-list {
            display: grid;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover { background: rgba(255,255,255,0.1); }
        .history-topic { font-size: 0.9em; color: #fff; }
        .history-date { font-size: 0.8em; color: #666; }
        .history-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
        }
        .history-status.completed { background: rgba(16,185,129,0.2); color: #10b981; }
        .history-status.researching { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #aaa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="api-status" id="apiStatus">检测API配置...</div>

    <div class="container">
        <div class="header">
            <h1>🤖 AI多智能体研究助手</h1>
            <p>Multi-Agent Research Assistant · 基于获奖项目架构灵感</p>
            <div class="agent-team">
                <span class="agent-badge">🎯 协调员</span>
                <span class="agent-badge researcher">📚 研究员</span>
                <span class="agent-badge analyst">🧠 分析师</span>
                <span class="agent-badge writer">✍️ 写作师</span>
                <span class="agent-badge reviewer">✅ 审核师</span>
            </div>
        </div>

        <div class="main-grid">
            <div class="card">
                <h2>🎯 研究任务</h2>
                <div class="input-group">
                    <label>研究主题</label>
                    <input type="text" id="topic" placeholder="例如：人工智能对大学生就业的影响  或  新能源汽车行业发展趋势">
                </div>

                <button class="btn btn-primary" id="startResearch" onclick="startResearch()">
                    🚀 启动多Agent研究
                </button>

                <div class="status-bar" id="statusBar">
                    <div>正在协调多个Agent工作...</div>
                    <div class="progress-steps" id="progressSteps"></div>
                </div>

                <div class="quick-section">
                    <h3 style="margin: 20px 0 12px; color: #aaa; font-size: 1em;">⚡ 快速分析（单Agent）</h3>
                    <button class="btn btn-secondary" onclick="quickAnalysis()" style="width: 100%;">
                        快速分析（无需完整流程）
                    </button>
                    <div class="quick-result" id="quickResult"></div>
                </div>
            </div>

            <div class="card">
                <h2>📊 研究报告</h2>
                <div class="report-output" id="reportOutput">
                    <div class="report-content" id="reportContent"></div>
                </div>
                <div class="review-card" id="reviewCard">
                    <h3 style="color: #10b981; margin-bottom: 12px;">📋 报告评分</h3>
                    <div class="review-scores" id="reviewScores"></div>
                    <div id="reviewComments"></div>
                </div>
                <button class="copy-btn" id="copyBtn" onclick="copyReport()" style="display:none;">📋 复制报告</button>
            </div>
        </div>

        <div class="history-section card">
            <h2>📜 历史研究</h2>
            <div class="history-list" id="historyList">
                <div style="color: #666; text-align: center; padding: 20px;">暂无历史记录</div>
            </div>
        </div>
    </div>

    <script>
        let currentReport = '';

        // 检查API状态
        fetch('/api/agent_status').then(r => r.json()).then(data => {
            const statusEl = document.getElementById('apiStatus');
            if (data.api_status === '已配置') {
                statusEl.textContent = `✅ API已配置 (${data.provider})`;
                statusEl.classList.add('configured');
            } else {
                statusEl.textContent = '⚠️ API未配置 - 将使用演示模式';
            }
        }).catch(() => {
            document.getElementById('apiStatus').textContent = '⚠️ 无法连接服务器';
        });

        // 加载历史记录
        loadHistory();

        function loadHistory() {
            fetch('/api/history').then(r => r.json()).then(data => {
                const list = document.getElementById('historyList');
                if (data.length === 0) {
                    list.innerHTML = '<div style="color: #666; text-align: center; padding: 20px;">暂无历史记录</div>';
                    return;
                }
                list.innerHTML = data.map(item => `
                    <div class="history-item" onclick="loadSession('${item.id}')">
                        <div>
                            <div class="history-topic">${item.topic}</div>
                            <div class="history-date">${new Date(item.created_at).toLocaleString()}</div>
                        </div>
                        <span class="history-status ${item.status}">${item.status === 'completed' ? '✅ 完成' : '🔄 进行中'}</span>
                    </div>
                `).join('');
            });
        }

        function loadSession(sessionId) {
            fetch(`/api/session/${sessionId}`).then(r => r.json()).then(data => {
                if (data.report) {
                    showReport(data.report);
                    if (data.review) showReview(data.review);
                }
            });
        }

        function startResearch() {
            const topic = document.getElementById('topic').value.trim();
            if (!topic) { alert('请输入研究主题'); return; }

            const btn = document.getElementById('startResearch');
            btn.disabled = true;
            btn.textContent = '🤖 Agent工作中...';

            const statusBar = document.getElementById('statusBar');
            statusBar.classList.add('active');

            const steps = [
                { agent: '协调员', message: '任务分析中...' },
                { agent: '研究员', message: '正在搜索和收集信息...' },
                { agent: '分析师', message: '正在进行深度分析...' },
                { agent: '写作师', message: '正在生成研究报告...' },
                { agent: '审核师', message: '正在进行质量审核...' }
            ];

            const progressHTML = steps.map((s, i) => `
                <div class="step" id="step${i}">
                    <div class="step-icon">${i + 1}</div>
                    <div>
                        <div style="font-weight: 600;">${s.agent}</div>
                        <div class="step-text">${s.message}</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('progressSteps').innerHTML = progressHTML;

            // 模拟进度更新
            let stepIndex = 0;
            const interval = setInterval(() => {
                if (stepIndex > 0) {
                    document.getElementById(`step${stepIndex - 1}`).classList.remove('active');
                    document.getElementById(`step${stepIndex - 1}`).classList.add('done');
                }
                if (stepIndex < steps.length) {
                    document.getElementById(`step${stepIndex}`).classList.add('active');
                }
                stepIndex++;
                if (stepIndex >= steps.length + 1) clearInterval(interval);
            }, 2000);

            fetch('/api/research', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic })
            }).then(r => r.json()).then(data => {
                clearInterval(interval);
                btn.disabled = false;
                btn.textContent = '🚀 启动多Agent研究';

                if (data.error) {
                    alert(data.error);
                    return;
                }

                showReport(data.report);
                if (data.review) showReview(data.review);
                loadHistory();

                // 标记所有步骤完成
                for (let i = 0; i < steps.length; i++) {
                    document.getElementById(`step${i}`).classList.remove('active');
                    document.getElementById(`step${i}`).classList.add('done');
                }
            }).catch(err => {
                clearInterval(interval);
                btn.disabled = false;
                btn.textContent = '🚀 启动多Agent研究';
                alert('研究失败: ' + err.message);
            });
        }

        function quickAnalysis() {
            const topic = document.getElementById('topic').value.trim();
            if (!topic) { alert('请输入分析主题'); return; }

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⚡ 分析中...';

            fetch('/api/quick_analysis', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic })
            }).then(r => r.json()).then(data => {
                btn.disabled = false;
                btn.textContent = '⚡ 快速分析（单Agent）';

                if (data.error) {
                    alert(data.error);
                    return;
                }

                const resultEl = document.getElementById('quickResult');
                resultEl.innerHTML = marked(data.result);
                resultEl.classList.add('active');
            }).catch(err => {
                btn.disabled = false;
                btn.textContent = '⚡ 快速分析（单Agent）';
                alert('分析失败: ' + err.message);
            });
        }

        function showReport(report) {
            currentReport = report;
            const output = document.getElementById('reportOutput');
            const content = document.getElementById('reportContent');
            content.innerHTML = marked(report);
            output.classList.add('active');
            document.getElementById('copyBtn').style.display = 'block';
        }

        function showReview(review) {
            const card = document.getElementById('reviewCard');
            card.classList.add('active');

            const scoresHTML = `
                <div class="score-item"><div class="score-value">${review.completeness || 8}</div><div class="score-label">完整性</div></div>
                <div class="score-item"><div class="score-value">${review.accuracy || 8}</div><div class="score-label">准确性</div></div>
                <div class="score-item"><div class="score-value">${review.logic || 8}</div><div class="score-label">逻辑性</div></div>
                <div class="score-item"><div class="score-value">${review.innovation || 7}</div><div class="score-label">创新性</div></div>
                <div class="score-item"><div class="score-value" style="color: #7c3aed;">${review.overall || 8}</div><div class="score-label">综合评分</div></div>
            `;
            document.getElementById('reviewScores').innerHTML = scoresHTML;

            const commentsHTML = (review.comments || []).map(c => `<li>${c}</li>`).join('');
            document.getElementById('reviewComments').innerHTML = `<ul style="margin: 8px 0 0 20px; color: #aaa; font-size: 0.9em;">${commentsHTML}</ul>`;
        }

        function copyReport() {
            navigator.clipboard.writeText(currentReport).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅ 已复制!';
                setTimeout(() => btn.textContent = '📋 复制报告', 2000);
            });
        }

        // 简单的Markdown解析
        function marked(text) {
            return text
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/^(.+)$/gm, (m, p1) => {
                    if (p1.startsWith('<')) return p1;
                    return `<p>${p1}</p>`;
                });
        }
    </script>
</body>
</html>
