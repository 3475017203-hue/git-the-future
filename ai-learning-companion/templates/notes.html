<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 笔记管理 - AI学习伙伴</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .navbar {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .navbar h1 { color: #667eea; font-size: 24px; }
        .nav-links { display: flex; gap: 12px; }
        .nav-links a {
            padding: 8px 18px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-links a:hover { background: #5a6fd6; }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
        }
        
        .panel {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .panel h2 { color: #333; margin-bottom: 16px; }
        
        .note-list { display: flex; flex-direction: column; gap: 12px; }
        .note-item {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .note-item:hover { background: #eef0f5; border-color: #667eea; }
        .note-item .title { font-weight: 600; color: #333; font-size: 16px; margin-bottom: 6px; }
        .note-item .meta { font-size: 12px; color: #888; }
        .note-item .tags span {
            display: inline-block;
            background: #e8eaff;
            color: #667eea;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-right: 4px;
        }
        
        .editor-form { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-weight: 600; color: #555; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select {
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group textarea { resize: vertical; min-height: 120px; }
        
        .btn-row { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        .btn-danger { background: #ff6b6b; color: white; }
        .btn-danger:hover { background: #ee5a5a; }
        .btn-secondary { background: #e0e0e0; color: #555; }
        .btn-secondary:hover { background: #d0d0d0; }
        
        .empty-state { text-align: center; padding: 40px; color: #888; }
        
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1>📚 AI学习伙伴</h1>
            <div class="nav-links">
                <a href="/">🏠 首页</a>
                <a href="/notes">📝 笔记</a>
                <a href="/pomodoro">🍅 番茄钟</a>
            </div>
        </nav>
        
        <div class="main-content">
            <!-- 笔记列表 -->
            <div class="panel">
                <h2>📝 我的笔记</h2>
                <div class="note-list" id="note-list">
                    {% if notes %}
                        {% for note in notes %}
                        <div class="note-item" onclick="loadNote('{{ note[0] }}')">
                            <div class="title">{{ note[1] }}</div>
                            <div class="meta">{{ note[3] or '无分类' }} · {{ note[5][:10] }}</div>
                            <div class="tags">
                                {% if note[4] %}
                                    {% for tag in note[4].split(',') %}
                                    <span>{{ tag.strip() }}</span>
                                    {% endfor %}
                                {% endif %}
                            </div>
                        </div>
                        {% endfor %}
                    {% else %}
                        <div class="empty-state">
                            <p style="font-size:40px;margin-bottom:10px">📒</p>
                            <p>还没有笔记，右侧创建第一篇吧！</p>
                        </div>
                    {% endif %}
                </div>
            </div>
            
            <!-- 编辑器 -->
            <div class="panel">
                <h2 id="editor-title">✏️ 新建笔记</h2>
                <form class="editor-form" id="note-form">
                    <input type="hidden" id="note-id" value="">
                    <div class="form-group">
                        <label>标题</label>
                        <input type="text" id="note-title" placeholder="输入笔记标题" required>
                    </div>
                    <div class="form-group">
                        <label>科目/分类</label>
                        <select id="note-subject">
                            <option value="">无分类</option>
                            <option value="数学">🔢 数学</option>
                            <option value="物理">⚡ 物理</option>
                            <option value="化学">🧪 化学</option>
                            <option value="英语">🇬🇧 英语</option>
                            <option value="历史">📜 历史</option>
                            <option value="编程">💻 编程</option>
                            <option value="其他">📋 其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <textarea id="note-content" placeholder="输入笔记内容..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>标签（用逗号分隔）</label>
                        <input type="text" id="note-tags" placeholder="例如: 重要, 复习, 公式">
                    </div>
                    <div class="btn-row">
                        <button type="submit" class="btn btn-primary">💾 保存</button>
                        <button type="button" class="btn btn-danger" onclick="deleteNote()" style="display:none" id="delete-btn">🗑️ 删除</button>
                    </div>
                    <button type="button" class="btn btn-secondary" onclick="newNote()" style="margin-top:4px">📄 新建</button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
    let currentNoteId = null;
    
    function newNote() {
        currentNoteId = null;
        document.getElementById('note-id').value = '';
        document.getElementById('note-title').value = '';
        document.getElementById('note-subject').value = '';
        document.getElementById('note-content').value = '';
        document.getElementById('note-tags').value = '';
        document.getElementById('editor-title').textContent = '✏️ 新建笔记';
        document.getElementById('delete-btn').style.display = 'none';
    }
    
    function loadNote(id) {
        const notes = {{ notes|tojson }};
        const note = notes.find(n => n[0] === id);
        if (!note) return;
        
        currentNoteId = id;
        document.getElementById('note-id').value = note[0];
        document.getElementById('note-title').value = note[1];
        document.getElementById('note-subject').value = note[3] || '';
        document.getElementById('note-content').value = note[2];
        document.getElementById('note-tags').value = note[4] || '';
        document.getElementById('editor-title').textContent = '✏️ 编辑笔记';
        document.getElementById('delete-btn').style.display = 'block';
        
        document.querySelector('.main-content').scrollIntoView({behavior: 'smooth'});
    }
    
    document.getElementById('note-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            action: currentNoteId ? 'update' : 'create',
            id: currentNoteId,
            title: document.getElementById('note-title').value,
            subject: document.getElementById('note-subject').value,
            content: document.getElementById('note-content').value,
            tags: document.getElementById('note-tags').value,
        };
        
        try {
            const res = await fetch('/notes', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            
            if (result.success) {
                alert('保存成功！');
                location.reload();
            }
        } catch (e) {
            alert('保存失败: ' + e.message);
        }
    });
    
    async function deleteNote() {
        if (!currentNoteId || !confirm('确定要删除这篇笔记吗？')) return;
        
        try {
            const res = await fetch('/notes', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'delete', id: currentNoteId})
            });
            const result = await res.json();
            
            if (result.success) {
                newNote();
                location.reload();
            }
        } catch (e) {
            alert('删除失败: ' + e.message);
        }
    }
    </script>
</body>
</html>
