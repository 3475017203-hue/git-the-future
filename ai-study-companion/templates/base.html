<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI自习伙伴{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
        
        /* 导航栏 */
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 60px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            color: white;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-brand:hover { color: #ffd700; }
        .navbar-links {
            display: flex;
            gap: 4px;
            margin-left: 32px;
        }
        .navbar-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }
        .navbar-links a:hover, .navbar-links a.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .nav-right {
            margin-left: auto;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
        }
        
        /* 内容区 */
        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
        
        /* 卡片 */
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-icon { font-size: 32px; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; color: #333; }
        .stat-label { font-size: 13px; color: #888; margin-top: 4px; }
        .stat-card.highlight { background: linear-gradient(135deg, #ff6b6b, #ffa500); color: white; }
        .stat-card.highlight .stat-value, .stat-card.highlight .stat-label { color: white; }
        
        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; transform: translateY(-1px); }
        .btn-success { background: #4CAF50; color: white; }
        .btn-success:hover { background: #43a047; }
        .btn-danger { background: #f44336; color: white; }
        .btn-danger:hover { background: #e53935; }
        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }
        .btn-outline:hover { background: #667eea; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* 表格 */
        .table { width: 100%; border-collapse: collapse; }
        .table th { text-align: left; padding: 12px; border-bottom: 2px solid #f0f0f0; color: #888; font-size: 13px; }
        .table td { padding: 12px; border-bottom: 1px solid #f5f5f5; }
        .table tr:hover { background: #f9f9f9; }
        
        /* 标签 */
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag-blue { background: #e3f2fd; color: #1976d2; }
        .tag-green { background: #e8f5e9; color: #388e3c; }
        .tag-orange { background: #fff3e0; color: #f57c00; }
        .tag-red { background: #ffebee; color: #d32f2f; }
        .tag-purple { background: #f3e5f5; color: #7b1fa2; }
        
        /* 输入框 */
        input[type="text"], input[type="search"], textarea, select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: #667eea; }
        textarea { resize: vertical; min-height: 120px; }
        
        /* 表单 */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-weight: 500; margin-bottom: 6px; color: #555; font-size: 14px; }
        
        /* 闪卡 */
        .flashcard {
            perspective: 1000px;
            width: 100%;
            max-width: 500px;
            height: 280px;
            margin: 0 auto 20px;
        }
        .flashcard-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
        }
        .flashcard-front { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .flashcard-back { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; transform: rotateY(180deg); }
        
        /* 进度条 */
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; transition: width 0.5s; }
        
        /* Toast通知 */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: #4CAF50; }
        .toast.error { background: #f44336; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* 学习记录 */
        .log-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
        }
        .log-icon { font-size: 18px; }
        .log-time { color: #999; font-size: 12px; min-width: 70px; }
        .log-text { color: #555; }
        
        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center;
        }
        .toolbar .search-box {
            flex: 1;
            min-width: 200px;
        }
        
        /* AI回答区 */
        .ai-response {
            background: linear-gradient(135deg, #f8f9ff, #f0f2ff);
            border: 1px solid #e0e0ff;
            border-radius: 16px;
            padding: 20px;
            margin-top: 16px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        
        /* 评分按钮组 */
        .rating-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }
        .rating-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .rating-btn.again { border-color: #f44336; color: #f44336; }
        .rating-btn.hard { border-color: #ff9800; color: #ff9800; }
        .rating-btn.good { border-color: #4CAF50; color: #4CAF50; }
        .rating-btn.easy { border-color: #2196F3; color: #2196F3; }
        .rating-btn:hover { transform: scale(1.05); }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .navbar-links { display: none; }
            .container { padding: 0 12px; }
            .card { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">📚 AI自习伙伴</a>
        <div class="navbar-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">🏠 首页</a>
            <a href="/subjects" class="{% if '/subjects' in request.path %}active{% endif %}">📂 科目</a>
            <a href="/notes" class="{% if '/note' in request.path or request.path == '/notes' %}active{% endif %}">📝 笔记</a>
            <a href="/flashcards" class="{% if '/flashcard' in request.path %}active{% endif %}">🃏 闪卡</a>
            <a href="/review" class="{% if request.path == '/review' %}active{% endif %}">🧠 复习</a>
            <a href="/ask" class="{% if request.path == '/ask' %}active{% endif %}">💬 问答</a>
        </div>
        <div class="nav-right">✨ Powered by 大模型</div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    <script>
        // Toast通知
        function showToast(msg, type='info') {
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        
        // AJAX请求封装
        async function api(url, data, method='POST') {
            try {
                const resp = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: data ? JSON.stringify(data) : undefined
                });
                return await resp.json();
            } catch (e) {
                return { success: false, error: '网络错误: ' + e.message };
            }
        }
        
        // 删除确认
        function confirmDelete(url, msg='确认删除？') {
            if (confirm(msg)) {
                api(url, null, 'POST').then(r => {
                    if (r.success) { showToast('删除成功', 'success'); location.reload(); }
                    else showToast(r.error || '删除失败', 'error');
                });
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
